
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEase - My Profile</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


    <!-- HEADER -->

    <header class="header">

        <a href="index.html" class="logo">ShopEase<span class="logo-dot">.</span></a>

        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="product.html">Products</a>
            <a href="orders.html">Orders</a>
            <a href="profile.html" class="active">My Profile</a>

        </nav>

        <div class="header-actions">

            <button
                class="login-btn"
                type="button"
                onclick="openModal('login')">

                Login

            </button>

            <button
                class="register-btn"
                type="button"
                onclick="openModal('register')">

                Register

            </button>

        </div>

    </header>



    <!-- PROFILE -->

    <main class="profile-page">

        <div class="profile-heading">
            <h1>My Profile</h1>

            <p>Manage your account information.</p>
        </div>



        <!-- ACCOUNT DETAILS -->

        <section class="profile-card">

            <div class="profile-details"><p style="padding:20px; color:#666;">Loading profile...</p></div>
        </section>



        <!-- PASSWORD -->

        <section class="profile-card">

            <div class="profile-details"><p style="padding:20px; color:#666;">Loading profile...</p></div>
        </section>


    </main>

    <!-- FLOATING CART -->

    <a href="cart.html" class="floating-cart" aria-label="Shopping Cart">
        <span class="cart-icon">
            🛒
        </span>
    </a>


    <!-- LOGIN / REGISTER MODAL -->

    <div class="modal-overlay" id="authModal">

        <div class="auth-modal">
            <button
                class="close-modal"
                type="button"
                onclick="closeModal()">
                &times;
            </button>

            <!-- LOGIN -->

            <div id="loginForm">
                <h2>
                    Welcome Back
                </h2>
                <p>
                    Login to your account
                </p>
                <form action="login.php" method="POST">

                    <label for="loginEmail">
                        Email
                    </label>
                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="Enter your email"
                        required>

                    <label for="loginPassword">
                        Password
                    </label>
                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter your password"
                        required>

                    <button
                        type="submit"
                        class="auth-submit">
                        Login
                    </button>

                </form>


                <div class="switch-form">
                    Don't have an account?

                    <button
                        type="button"
                        onclick="openModal('register')">
                        Register
                    </button>

                </div>

            </div>



            <!-- REGISTRATION -->

            <div id="registerForm">

                <h2>Create Account</h2>

                <p>
                    Register for a new account
                </p>

                <form action="register.php" method="POST">
                    
                    <label for="registerName">Full Name</label>
                    <input
                        type="text"
                        id="registerName"
                        name="name"
                        placeholder="Enter your name"
                        required>

                    <label for="registerEmail">Email</label>
                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="Enter your email"
                        required>
        
                    <label for="registerPassword">Password</label>
                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Create a password"
                        required>

                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required>
                        
                    <button
                        type="submit"
                        class="auth-submit">
                        Register
                    </button>

                </form>


                <div class="switch-form">
                    Already have an account?

                    <button
                        type="button"
                        onclick="openModal('login')">
                        Login
                    </button>

                </div>

            </div>

        </div>

    </div>
    

    <script src="js/api-client.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
